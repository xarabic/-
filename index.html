          background: #000000;
          display: block;
        }

        #videoPage .video-info-main {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 20px;
        }
        #videoPage .video-info-main h1 {
          font-size: 22px;
          font-weight: 700;
          color: var(--text-main);
          flex: 1;
          min-width: 200px;
        }

        .video-three-dots {
          background: rgba(255, 0, 51, 0.06);
          border: 1px solid rgba(255, 0, 51, 0.08);
          color: var(--text-muted);
          padding: 10px 18px;
          border-radius: 30px;
          font-size: 20px;
          cursor: pointer;
          transition: all 0.3s ease;
          line-height: 1;
          position: relative;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .video-three-dots::after {
          content: 'خيارات';
          font-size: 13px;
          font-weight: 500;
          color: var(--text-muted);
        }
        .video-three-dots:hover {
          background: rgba(255, 0, 51, 0.12);
          color: #ff0033;
          border-color: #ff0033;
        }
        .video-three-dots:hover::after {
          color: #ff0033;
        }

        .video-dropdown {
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) scale(0.95);
          background: #ffffff;
          border-radius: 20px;
          box-shadow: 0 20px 80px rgba(0, 0, 0, 0.25);
          border: 1px solid var(--border-color);
          min-width: 300px;
          max-width: 90vw;
          padding: 16px 12px;
          z-index: 9999;
          animation: dropIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .video-dropdown.show { display: block; }

        .video-dropdown .menu-item {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 14px 18px;
          border: none;
          background: none;
          width: 100%;
          text-align: right;
          font-size: 15px;
          font-weight: 500;
          color: var(--text-main);
          border-radius: 12px;
          cursor: pointer;
          transition: all 0.2s ease;
        }
        .video-dropdown .menu-item:hover {
          background: rgba(255, 0, 51, 0.06);
          color: #ff0033;
        }
        .video-dropdown .menu-item .icon {
          font-size: 20px;
          min-width: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .video-dropdown .divider {
          height: 1px;
          background: var(--border-color);
          margin: 6px 12px;
        }
        .video-dropdown .menu-title {
          text-align: center;
          font-size: 12px;
          color: var(--text-muted);
          padding: 4px 0 12px 0;
          font-weight: 600;
          letter-spacing: 1px;
        }

        .auto-play-toggle {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 8px 16px;
          background: rgba(255, 0, 51, 0.04);
          border-radius: 30px;
          border: 1px solid rgba(255, 0, 51, 0.08);
          width: fit-content;
          margin: 0 0 20px 0;
        }
        .auto-play-toggle label { font-size: 14px; color: var(--text-muted); cursor: pointer; }
        .auto-play-toggle input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ff0033; cursor: pointer; }

        #videoPage .suggested-title {
          font-size: 18px;
          font-weight: 700;
          margin-bottom: 16px;
          display: flex;
          align-items: center;
          gap: 8px;
          color: var(--text-main);
        }
        #videoPage .suggested-title::before { content: '◆'; font-size: 12px; color: #ff0033; }

        .suggested-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 16px;
        }

        .suggested-card {
          background: var(--bg-card);
          border-radius: 12px;
          overflow: hidden;
          cursor: pointer;
          transition: all 0.3s ease;
          border: 1px solid var(--border-color);
        }
        .suggested-card:hover {
          transform: translateY(-4px);
          border-color: #ff0033;
          box-shadow: 0 8px 25px var(--accent-glow);
        }
        .suggested-thumb {
          position: relative;
          width: 100%;
          aspect-ratio: 16 / 9;
          background: #f0f0f0;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .suggested-thumb img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          background: #f0f0f0;
          position: absolute;
          top: 0;
          left: 0;
        }
        .suggested-info { padding: 10px 12px; }
        .suggested-info h4 {
          font-size: 13px;
          font-weight: 600;
          line-height: 1.3;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          color: var(--text-main);
        }

        .toast {
          position: fixed;
          bottom: 30px;
          left: 50%;
          transform: translateX(-50%);
          background: #1a1a1a;
          color: #ffffff;
          padding: 12px 28px;
          border-radius: 30px;
          font-size: 14px;
          z-index: 999;
          border: 1px solid rgba(255, 255, 255, 0.06);
          animation: fadeUp 0.3s ease;
          box-shadow: 0 8px 30px rgba(0,0,0,0.2);
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .toast .toast-icon { font-size: 18px; }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
          to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @media (max-width: 768px) {
          header { padding: 10px 16px; }
          .logo { font-size: 22px; }
          .logo .x { font-size: 26px; }
          .logo .arabic { font-size: 22px; }
          .logo .dot { font-size: 22px; }
          .back-home { font-size: 12px; padding: 6px 12px; }
          .container { padding: 14px 8px; }
          .videos-grid {
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
          }
          #videoPage .video-info-main { flex-direction: column; align-items: flex-start; }
          #videoPage .video-info-main h1 { font-size: 18px; }
          .suggested-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
          .play-btn { width: 50px; height: 50px; font-size: 18px; }
          .video-three-dots::after { content: ''; }
          .dropdown-menu, .video-dropdown { min-width: 280px; max-width: 95vw; padding: 14px 10px; }
        }

        @media (max-width: 480px) {
          .videos-grid {
            grid-template-columns: 1fr;
            gap: 14px;
            max-width: 100%;
          }
          .card-info { padding: 10px 12px; }
          .card-title { font-size: 14px; padding-left: 34px; }
          .badge-hd { font-size: 9px; padding: 2px 6px; top: 6px; right: 6px; }
          .play-btn { width: 44px; height: 44px; font-size: 16px; }
          #videoPage .video-wrapper-main { border-radius: 10px; }
          #videoPage .video-info-main h1 { font-size: 16px; }
          .suggested-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
          .suggested-info h4 { font-size: 11px; }
          .three-dots { font-size: 18px; top: 10px; left: 10px; }
          .dropdown-menu, .video-dropdown { min-width: 260px; max-width: 95vw; padding: 12px 8px; }
          .badge-new { font-size: 8px; padding: 2px 8px; top: 6px; left: 6px; }
        }
    </style>
</head>
<body>

  <header>
    <a class="logo" href="#" onclick="navigateHome(); return false;">
      <span class="x">X</span><span class="dot">.</span><span class="arabic">ARABIC</span>
    </a>
    <a class="back-home" href="#" onclick="navigateHome(); return false;">🏠 الرئيسية</a>
  </header>

  <div class="container" id="homePage">
    <h2 class="section-title">جميع الفيديوهات</h2>
    <div class="videos-grid" id="videosGrid"></div>
  </div>

  <div class="container" id="videoPage">
    <div class="video-wrapper-main">
      <video id="videoPlayerMain" controls autoplay playsinline preload="metadata">
        <source id="videoSourceMain" src="" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
      </video>
    </div>

    <div class="video-info-main">
      <h1 id="activeTitleMain">عنوان الفيديو</h1>
      <div style="position:relative;">
        <button class="video-three-dots" onclick="toggleVideoMenu(event)">⋮</button>
        <div class="video-dropdown" id="videoDropdown">
          <div class="menu-title">⋮ خيارات الفيديو</div>
          <button class="menu-item" onclick="copyCurrentVideoUrl()">
            <span class="icon">📋</span> نسخ الرابط
          </button>
          <button class="menu-item" onclick="shareVideo()">
            <span class="icon">📤</span> مشاركة
          </button>
          <div class="divider"></div>
          <button class="menu-item" onclick="reportVideo()" style="color:#ff0033;">
            <span class="icon">🚨</span> الإبلاغ عن مشكلة
          </button>
        </div>
      </div>
    </div>

    <div class="auto-play-toggle">
      <input type="checkbox" id="autoPlayCheckbox" checked>
      <label for="autoPlayCheckbox">▶ تشغيل تلقائي للفيديو التالي</label>
    </div>

    <div class="suggested-title">🎯 قد يعجبك أيضاً</div>
    <div class="suggested-grid" id="suggestedGridMain"></div>
  </div>

  <script>
    // ===== قائمة الفيديوهات (الترتيب: الأحدث أولاً) =====
    const videos = [
      {
        id: 'miranori',
        title: ' سكس سحاق ميرا نوري و كارما  فيديو حصري جديد',
        url: 'https://lshshaykrouxohgszlli.supabase.co/storage/v1/object/public/Video/miranori.mp4',
        thumbnail: 'https://i.postimg.cc/MT1Lm25p/IMG-20260809-221811.jpg',
        hd: true,
        new: true
      },
      {
        id: 'sidi',
        title: '🎬 سكس نيك مصرية',
        url: 'https://lshshaykrouxohgszlli.supabase.co/storage/v1/object/public/Video/sidi.mp4',
        thumbnail: 'https://i.postimg.cc/zB3g9D87/IMG-20260729-052856.jpg',
        hd: true,
        new: false
      },
      {
        id: 'video4',
        title: 'بنت حلوة تلعب في كسها الهيجان',
        url: 'https://lshshaykrouxohgszlli.supabase.co/storage/v1/object/public/Video/sidsi.mp4',
        thumbnail: 'https://i.postimg.cc/yxn3WHJz/IMG-20260729-052210.jpg',
        hd: true,
        new: false
      },
      {
        id: 'new-video-2026',
        title: '🔥 فيديو حصري جديد بنت تلعب في كسها الساخن',
        url: 'https://lshshaykrouxohgszlli.supabase.co/storage/v1/object/public/Video/2rse3mhkvr.mp4',
        thumbnail: 'https://i.postimg.cc/PxbgnHyS/Screenshot-20260729-212409-2.jpg',
        hd: true,
        new: false
      }
    ];

    let autoPlayEnabled = true;
    let currentVideoIndex = 0;

    // ===== قراءة الفيديو من الرابط =====
    function getVideoFromURL() {
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get('video');
      if (videoId) {
        const index = videos.findIndex(v => v.id === videoId);
        if (index !== -1) {
          return index;
        }
      }
      return -1;
    }

    // ===== تحديث الرابط =====
    function updateURL(videoId) {
      const url = new URL(window.location.href);
      url.search = '?video=' + videoId;
      window.history.pushState({}, '', url);
    }

    // ===== عرض الفيديوهات =====
    function renderVideos() {
      const grid = document.getElementById('videosGrid');
      grid.innerHTML = '';

      videos.forEach((video, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.position = 'relative';

        const thumbSrc = video.thumbnail || '';

        card.addEventListener('click', () => {
          navigateToVideo(index);
        });

        card.innerHTML = `
          <div class="thumb">
            <img class="thumb-img" src="${thumbSrc}" alt="${video.title}" loading="lazy" decoding="async"
                 onerror="this.parentElement.innerHTML = '<div class=\\'thumb-fallback\\'>🎬</div>'">
            <span class="badge-hd">${video.hd ? 'HD' : 'SD'}</span>
            ${video.new ? '<span class="badge-new">جديد 🔥</span>' : ''}
            <div class="play-btn">▶</div>
          </div>
          <div class="card-info">
            <div class="card-title">${video.title}</div>
            <button class="three-dots" onclick="event.stopPropagation(); toggleMenu(event, ${index})">⋮</button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ===== عرض المقترحات (مع استبعاد الفيديو الحالي) =====
    function renderSuggested(currentIndex) {
      const grid = document.getElementById('suggestedGridMain');
      grid.innerHTML = '';

      // استبعاد الفيديو الحالي فقط
      const suggested = videos.filter((_, i) => i !== currentIndex);
      const selected = suggested.slice(0, 4);

      selected.forEach((video) => {
        const card = document.createElement('div');
        card.className = 'suggested-card';
        const originalIndex = videos.indexOf(video);
        card.onclick = () => navigateToVideo(originalIndex);

        const thumbSrc = video.thumbnail || '';

        card.innerHTML = `
          <div class="suggested-thumb">
            <img src="${thumbSrc}" alt="${video.title}" loading="lazy" decoding="async"
                 onerror="this.parentElement.innerHTML = '<div class=\\'thumb-fallback\\' style=\\'font-size:30px;\\'>🎬</div>'">
          </div>
          <div class="suggested-info">
            <h4>${video.title}</h4>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ===== القائمة المنسدلة =====
    function toggleMenu(event, index) {
      event.stopPropagation();
      closeAllMenus();

      const overlay = document.createElement('div');
      overlay.className = 'dropdown-overlay show';
      overlay.id = 'dropdownOverlay';
      overlay.onclick = function() { closeAllMenus(); };
      document.body.appendChild(overlay);

      const menu = document.createElement('div');
      menu.className = 'dropdown-menu show';
      menu.id = `menu-${index}`;
      menu.innerHTML = `
        <div class="menu-title">⋮ خيارات الفيديو</div>
        <button class="menu-item" onclick="copyVideoUrl(${index})">
          <span class="icon">📋</span> نسخ الرابط
        </button>
        <button class="menu-item" onclick="shareVideoUrl(${index})">
          <span class="icon">📤</span> مشاركة
        </button>
        <div class="divider"></div>
        <button class="menu-item" onclick="reportVideo()" style="color:#ff0033;">
          <span class="icon">🚨</span> الإبلاغ عن مشكلة
        </button>
      `;
      document.body.appendChild(menu);
    }

    function toggleVideoMenu(event) {
      event.stopPropagation();
      closeAllMenus();

      const overlay = document.createElement('div');
      overlay.className = 'dropdown-overlay show';
      overlay.id = 'dropdownOverlay';
      overlay.onclick = function() { closeAllMenus(); };
      document.body.appendChild(overlay);

      document.getElementById('videoDropdown').classList.add('show');
    }

    // ===== نسخ ومشاركة =====
    function copyVideoUrl(index) {
      const video = videos[index];
      const url = window.location.href.split('?')[0] + '?video=' + video.id;
      copyToClipboard(url);
      closeAllMenus();
    }

    function shareVideoUrl(index) {
      const video = videos[index];
      const url = window.location.href.split('?')[0] + '?video=' + video.id;
      if (navigator.share) {
        navigator.share({ title: video.title, text: '🎬 شاهد هذا الفيديو على X.ARABIC', url: url }).catch(() => {});
      } else {
        copyToClipboard(url);
        showToast('📤 تم نسخ الرابط للمشاركة');
      }
      closeAllMenus();
    }

    function copyCurrentVideoUrl() {
      const video = videos[currentVideoIndex];
      const url = window.location.href.split('?')[0] + '?video=' + video.id;
      copyToClipboard(url);
      closeAllMenus();
    }

    function shareVideo() {
      const video = videos[currentVideoIndex];
      const url = window.location.href.split('?')[0] + '?video=' + video.id;
      if (navigator.share) {
        navigator.share({ title: video.title, text: '🎬 شاهد هذا الفيديو على X.ARABIC', url: url }).catch(() => {});
      } else {
        copyToClipboard(url);
        showToast('📤 تم نسخ الرابط للمشاركة');
      }
      closeAllMenus();
    }

    function reportVideo() {
      showToast('🚨 تم إرسال البلاغ، سيتم مراجعته قريباً');
      closeAllMenus();
    }

    function copyToClipboard(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('✅ تم نسخ الرابط!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const input = document.createElement('input');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      showToast('✅ تم نسخ الرابط!');
    }

    function showToast(msg) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = msg;
      document.body.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        t.style.transition = 'opacity 0.4s';
        setTimeout(() => t.remove(), 400);
      }, 2500);
    }

    function closeAllMenus() {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.remove());
      document.querySelectorAll('.dropdown-overlay').forEach(overlay => overlay.remove());
      document.getElementById('videoDropdown')?.classList.remove('show');
    }

    // ===== التنقل بين الفيديوهات =====
    function navigateToVideo(index) {
      const video = videos[index];
      if (!video) return;
      currentVideoIndex = index;
      closeAllMenus();
      
      document.getElementById('homePage').style.display = 'none';
      document.getElementById('videoPage').style.display = 'block';
      document.getElementById('activeTitleMain').textContent = video.title;
      
      const source = document.getElementById('videoSourceMain');
      const player = document.getElementById('videoPlayerMain');
      source.src = video.url;
      player.load();
      player.play().catch(() => {});
      
      renderSuggested(index);
      updateURL(video.id);
      window.scrollTo(0, 0);
    }

    function navigateHome() {
      document.getElementById('homePage').style.display = 'block';
      document.getElementById('videoPage').style.display = 'none';
      closeAllMenus();
      const player = document.getElementById('videoPlayerMain');
      player.pause();
      player.currentTime = 0;
      window.history.pushState({}, '', window.location.href.split('?')[0]);
    }

    // ===== معالجة الرابط عند التحميل =====
    function handleURL() {
      const index = getVideoFromURL();
      if (index !== -1) {
        currentVideoIndex = index;
        document.getElementById('homePage').style.display = 'none';
        document.getElementById('videoPage').style.display = 'block';
        const video = videos[index];
        document.getElementById('activeTitleMain').textContent = video.title;
        const source = document.getElementById('videoSourceMain');
        const player = document.getElementById('videoPlayerMain');
        source.src = video.url;
        player.load();
        player.play().catch(() => {});
        renderSuggested(index);
      } else {
        document.getElementById('homePage').style.display = 'block';
        document.getElementById('videoPage').style.display = 'none';
      }
    }

    // ===== Auto-Play =====
    function setupAutoPlay() {
      const player = document.getElementById('videoPlayerMain');
      const checkbox = document.getElementById('autoPlayCheckbox');
      const saved = localStorage.getItem('autoPlayEnabled');
      if (saved !== null) {
        autoPlayEnabled = saved === 'true';
        checkbox.checked = autoPlayEnabled;
      }
      checkbox.addEventListener('change', function() {
        autoPlayEnabled = this.checked;
        localStorage.setItem('autoPlayEnabled', autoPlayEnabled);
      });
      player.addEventListener('ended', function() {
        if (autoPlayEnabled) {
          const suggested = videos.filter((_, i) => i !== currentVideoIndex);
          if (suggested.length > 0) {
            const nextIndex = videos.indexOf(suggested[0]);
            navigateToVideo(nextIndex);
          }
        }
      });
    }

    // ===== أحداث =====
    window.addEventListener('popstate', handleURL);

    document.addEventListener('DOMContentLoaded', () => {
      renderVideos();
      handleURL();
      setupAutoPlay();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') navigateHome();
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.three-dots') && !e.target.closest('.dropdown-menu')) {
        document.querySelectorAll('.dropdown-menu').forEach(menu => menu.remove());
        document.querySelectorAll('.dropdown-overlay').forEach(overlay => overlay.remove());
      }
      if (!e.target.closest('.video-three-dots') && !e.target.closest('.video-dropdown')) {
        document.getElementById('videoDropdown')?.classList.remove('show');
        document.querySelectorAll('.dropdown-overlay').forEach(overlay => overlay.remove());
      }
    });
  </script>
</body>
</html>
